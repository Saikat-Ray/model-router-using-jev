[project]
name = "model-router"
version = "0.1.0"
description = "Route each request to the right LLM, with Jev (TypeSafe) making the decision via OpenRouter."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pyyaml>=6.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
model-router = "model_router.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
